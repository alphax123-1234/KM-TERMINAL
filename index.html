<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USE Terminal · Bloomberg Aesthetic</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e11;
            color: #d1d4dc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            height: 100vh;
            overflow: hidden;
            padding: 8px;
        }
        .terminal {
            display: grid;
            grid-template-columns: 280px 1fr;
            grid-template-rows: 40px 1fr;
            gap: 6px;
            height: 100%;
            max-width: 1440px;
            margin: 0 auto;
        }
        .header {
            grid-column: 1 / 3;
            background: #131722;
            border: 1px solid #2a2e39;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #b2b9c7;
        }
        .header-left {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .header-left .exchange {
            color: #00ff66;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-left .currency {
            color: #a6b0c2;
        }
        .status-beacon {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .beacon {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff66;
            box-shadow: 0 0 8px #00ff66;
            transition: 0.2s;
        }
        .beacon.off {
            background: #ff3333;
            box-shadow: 0 0 8px #ff3333;
        }
        .watchlist {
            background: #131722;
            border: 1px solid #2a2e39;
            padding: 8px 0;
            overflow-y: auto;
            grid-row: 2 / 3;
        }
        .watchlist-item {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1e222d;
            cursor: pointer;
            transition: background 0.1s;
            color: #d1d4dc;
        }
        .watchlist-item:hover {
            background: #1e222d;
        }
        .watchlist-item .ticker {
            font-weight: 700;
            color: #f0f3fa;
        }
        .watchlist-item .price {
            font-weight: 600;
        }
        .watchlist-item .change {
            font-weight: 600;
            min-width: 60px;
            text-align: right;
        }
        .positive {
            color: #00ff66;
        }
        .negative {
            color: #ff3333;
        }
        .chart-panel {
            background: #131722;
            border: 1px solid #2a2e39;
            padding: 4px;
            position: relative;
            grid-row: 2 / 3;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            background: #131722;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #131722;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2e39;
        }
        .cache-status {
            color: #6b7a8f;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cache-status span {
            background: #1e222d;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .status-msg {
            padding: 8px 16px;
            font-size: 12px;
            color: #6b7a8f;
            border-bottom: 1px solid #1e222d;
        }
        .loading {
            color: #ffaa00;
        }
        .error {
            color: #ff3333;
        }
        .success {
            color: #00ff66;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            <div class="header-left">
                <span class="exchange">● USE · UGANDA SECURITIES EXCHANGE</span>
                <span class="currency">CURRENCY: UGX</span>
            </div>
            <div class="cache-status">
                <span id="cache-indicator">CACHE: --</span>
                <span id="ttl-indicator">TTL: --</span>
                <div class="status-beacon">
                    <span id="network-beacon" class="beacon"></span>
                    <span id="network-label">LIVE</span>
                </div>
            </div>
        </div>
        <div class="watchlist" id="watchlist">
            <div class="status-msg loading">⏳ Loading Ugandan stocks...</div>
        </div>
        <div class="chart-panel">
            <div id="chart-container"></div>
        </div>
    </div>
    <script>
        // ============================================================
        //  CONFIGURATION - PASTE YOUR API KEY HERE
        // ============================================================
        const MANSA_TOKEN = 'YOUR_API_KEY_HERE';
        const EXCHANGE_CODE = 'USE';
        const API_BASE = 'https://mansaapi.com';
        const CACHE_KEY = 'use_market_cache';
        const TTL_MS = 30 * 60 * 1000;

        // ============================================================
        //  FALLBACK DATA WITH REALISTIC UGANDAN STOCKS
        // ============================================================
        const FALLBACK_STOCKS = [
            { ticker: 'MTNU', name: 'MTN Uganda', sector: 'Telecom' },
            { ticker: 'SBU', name: 'Stanbic Bank Uganda', sector: 'Banking' },
            { ticker: 'UCL', name: 'Uganda Clays Limited', sector: 'Manufacturing' },
            { ticker: 'DFCU', name: 'DFCU Bank', sector: 'Banking' },
            { ticker: 'BOBU', name: 'Bank of Baroda Uganda', sector: 'Banking' },
            { ticker: 'NIC', name: 'National Insurance Corp', sector: 'Insurance' }
        ];

        // Generate realistic historical data
        function generateRealisticHistory(basePrice, days = 30, volatility = 0.03) {
            const data = [];
            let price = basePrice * 0.92;
            const now = new Date();
            
            for (let i = days - 1; i >= 0; i--) {
                const change = (Math.random() - 0.48) * volatility;
                price = price * (1 + change);
                if (price < 0.1) price = basePrice * 0.5;
                
                const date = new Date(now);
                date.setDate(date.getDate() - i);
                
                data.push({
                    date: date.toISOString().slice(0, 10),
                    close: Math.round(price * 100) / 100,
                    open: Math.round(price * (1 - (Math.random() * 0.01)) * 100) / 100,
                    high: Math.round(price * (1 + (Math.random() * 0.015)) * 100) / 100,
                    low: Math.round(price * (1 - (Math.random() * 0.015)) * 100) / 100,
                    volume: Math.floor(Math.random() * 50000) + 10000
                });
            }
            // Ensure last price matches base
            data[data.length - 1].close = basePrice;
            return data;
        }

        const FALLBACK_HISTORY = {
            MTNU: generateRealisticHistory(2450.50, 30, 0.035),
            SBU: generateRealisticHistory(380.00, 30, 0.04),
            UCL: generateRealisticHistory(125.00, 30, 0.05),
            DFCU: generateRealisticHistory(45.00, 30, 0.03),
            BOBU: generateRealisticHistory(12.50, 30, 0.045),
            NIC: generateRealisticHistory(8.50, 30, 0.04)
        };

        const FALLBACK_DATA = {
            MTNU: { price: 2450.50, change_pct: 0.8, volume: 15000, high: 2480, low: 2390 },
            SBU: { price: 380.00, change_pct: -1.2, volume: 8500, high: 385, low: 375 },
            UCL: { price: 125.00, change_pct: 2.4, volume: 3200, high: 128, low: 122 },
            DFCU: { price: 45.00, change_pct: 0.0, volume: 2100, high: 46, low: 44 },
            BOBU: { price: 12.50, change_pct: -0.5, volume: 1800, high: 13, low: 12 },
            NIC: { price: 8.50, change_pct: 1.2, volume: 950, high: 9, low: 8 }
        };

        // ============================================================
        //  STATE
        // ============================================================
        let currentTicker = 'MTNU';
        let chart = null;
        let lineSeries = null;
        let cachedData = null;
        let cacheTimestamp = null;
        let allStocks = [];

        const watchlistEl = document.getElementById('watchlist');
        const container = document.getElementById('chart-container');
        const cacheIndicator = document.getElementById('cache-indicator');
        const ttlIndicator = document.getElementById('ttl-indicator');
        const beacon = document.getElementById('network-beacon');
        const networkLabel = document.getElementById('network-label');

        // ============================================================
        //  HELPERS
        // ============================================================
        function setBeaconOnline(online) {
            beacon.className = online ? 'beacon' : 'beacon off';
            networkLabel.textContent = online ? 'LIVE' : 'OFFLINE';
        }

        // ============================================================
        //  CACHE
        // ============================================================
        function loadCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed.data || !parsed.timestamp) return null;
                if (Date.now() - parsed.timestamp > TTL_MS) return null;
                return parsed;
            } catch { return null; }
        }

        function saveCache(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data }));
                cachedData = data;
                cacheTimestamp = Date.now();
                updateCacheUI();
            } catch { /* ignore */ }
        }

        function updateCacheUI() {
            if (cachedData && cacheTimestamp) {
                const age = Date.now() - cacheTimestamp;
                const remaining = Math.max(0, (TTL_MS - age) / 1000);
                cacheIndicator.textContent = `CACHE: HIT`;
                ttlIndicator.textContent = `TTL: ${Math.floor(remaining / 60)}m ${Math.floor(remaining % 60)}s`;
            } else {
                cacheIndicator.textContent = `CACHE: MISS`;
                ttlIndicator.textContent = `TTL: --`;
            }
        }

        function showStatus(message, type = 'loading') {
            watchlistEl.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
        }

        // ============================================================
        //  API ENDPOINTS
        // ============================================================
        async function getUSEStocks() {
            try {
                if (!MANSA_TOKEN || MANSA_TOKEN === 'YOUR_API_KEY_HERE') {
                    throw new Error('API key not configured');
                }
                const response = await fetch(
                    `${API_BASE}/api/v1/markets/exchanges/${EXCHANGE_CODE}/stocks`,
                    {
                        headers: {
                            'Authorization': 'Bearer ' + MANSA_TOKEN,
                            'Accept': 'application/json'
                        }
                    }
                );
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.warn('Failed to fetch stocks list, using fallback:', error);
                return FALLBACK_STOCKS;
            }
        }

        async function getStockData(ticker) {
            try {
                if (!MANSA_TOKEN || MANSA_TOKEN === 'YOUR_API_KEY_HERE') {
                    throw new Error('API key not configured');
                }
                const response = await fetch(
                    `${API_BASE}/api/v1/markets/exchanges/${EXCHANGE_CODE}/stocks/${ticker}`,
                    {
                        headers: {
                            'Authorization': 'Bearer ' + MANSA_TOKEN,
                            'Accept': 'application/json'
                        }
                    }
                );
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.warn(`Failed to fetch ${ticker}, using fallback:`, error);
                return FALLBACK_DATA[ticker] || { price: 100, change_pct: 0, volume: 0 };
            }
        }

        async function getStockHistory(ticker, range = '1M') {
            try {
                if (!MANSA_TOKEN || MANSA_TOKEN === 'YOUR_API_KEY_HERE') {
                    throw new Error('API key not configured');
                }
                const response = await fetch(
                    `${API_BASE}/api/v1/markets/exchanges/${EXCHANGE_CODE}/stocks/${ticker}/history?range=${range}`,
                    {
                        headers: {
                            'Authorization': 'Bearer ' + MANSA_TOKEN,
                            'Accept': 'application/json'
                        }
                    }
                );
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.warn(`Failed to fetch history for ${ticker}, using fallback:`, error);
                return FALLBACK_HISTORY[ticker] || generateRealisticHistory(100, 30);
            }
        }

        // ============================================================
        //  CHART RENDER - FIXED VERSION
        // ============================================================
        function renderChart(ticker, historyData) {
            // Create chart if it doesn't exist
            if (!chart) {
                chart = window.LightweightCharts.createChart(container, {
                    width: container.clientWidth,
                    height: container.clientHeight,
                    layout: { 
                        background: { color: '#131722' }, 
                        textColor: '#b2b9c7' 
                    },
                    grid: { 
                        vertLines: { color: '#1e222d' }, 
                        horzLines: { color: '#1e222d' } 
                    },
                    crosshair: { 
                        mode: window.LightweightCharts.CrosshairMode.Normal 
                    },
                    timeScale: { 
                        borderColor: '#2a2e39',
                        timeVisible: true,
                        secondsVisible: false
                    },
                    rightPriceScale: {
                        borderColor: '#2a2e39'
                    }
                });
                lineSeries = chart.addLineSeries({
                    color: '#00ff66',
                    lineWidth: 2,
                    crosshairMarkerVisible: true,
                    priceLineVisible: true,
                    priceLineColor: '#2a2e39',
                    lastValueVisible: true
                });
            }

            // Update chart size
            chart.applyOptions({ 
                width: container.clientWidth, 
                height: container.clientHeight 
            });

            console.log(`Rendering chart for ${ticker}:`, historyData);

            // Parse and format the data
            let chartData = [];

            if (Array.isArray(historyData) && historyData.length > 0) {
                // Check if it's OHLCV format (has 'close' or 'date' fields)
                if (historyData[0].close !== undefined || historyData[0].date !== undefined) {
                    // Format: [{date: '2025-01-01', close: 2450, ...}]
                    chartData = historyData.map(item => ({
                        time: item.date || item.time || String(item.timestamp || Date.now()),
                        value: Number(item.close) || Number(item.price) || Number(item.value) || 0
                    }));
                } else if (historyData[0].time !== undefined && historyData[0].value !== undefined) {
                    // Already in chart format
                    chartData = historyData;
                } else {
                    // Try to convert any array to chart data
                    chartData = historyData.map((item, index) => {
                        if (typeof item === 'number') {
                            // Simple array of numbers
                            const date = new Date();
                            date.setDate(date.getDate() - (historyData.length - 1 - index));
                            return {
                                time: date.toISOString().slice(0, 10),
                                value: item
                            };
                        } else if (item.price) {
                            return {
                                time: item.date || item.time || `2025-01-${String(index+1).padStart(2,'0')}`,
                                value: Number(item.price)
                            };
                        } else {
                            // Try to find any numeric field
                            const keys = Object.keys(item);
                            const numKey = keys.find(k => typeof item[k] === 'number');
                            if (numKey) {
                                return {
                                    time: item.date || item.time || `2025-01-${String(index+1).padStart(2,'0')}`,
                                    value: Number(item[numKey])
                                };
                            }
                            return null;
                        }
                    }).filter(d => d !== null);
                }
            }

            // If no data, use fallback
            if (chartData.length === 0) {
                console.warn('No chart data, using fallback');
                const fallback = FALLBACK_HISTORY[ticker] || generateRealisticHistory(100, 30);
                chartData = fallback.map(item => ({
                    time: item.date,
                    value: item.close
                }));
            }

            console.log(`Chart data points: ${chartData.length}`, chartData.slice(0, 5));

            // Ensure data has valid values
            chartData = chartData.filter(d => d.value > 0 && !isNaN(d.value));

            if (chartData.length === 0) {
                // Emergency fallback
                chartData = generateRealisticHistory(100, 30).map(item => ({
                    time: item.date,
                    value: item.close
                }));
            }

            // Set data and fit
            try {
                lineSeries.setData(chartData);
                chart.timeScale().fitContent();
            } catch (err) {
                console.error('Chart render error:', err);
                // Try with simplified data
                const simplified = chartData.map(d => ({
                    time: d.time,
                    value: d.value
                }));
                lineSeries.setData(simplified);
                chart.timeScale().fitContent();
            }
        }

        // ============================================================
        //  WATCHLIST RENDER
        // ============================================================
        function renderWatchlist(stocks, liveData) {
            if (!stocks || stocks.length === 0) {
                showStatus('⚠️ No stocks available', 'error');
                return;
            }

            let html = '';
            for (const stock of stocks) {
                const ticker = stock.ticker || stock.symbol;
                if (!ticker) continue;
                
                const data = liveData[ticker] || FALLBACK_DATA[ticker] || { price: 0, change_pct: 0 };
                const price = data.price || 0;
                const change = data.change_pct || 0;
                const cls = change >= 0 ? 'positive' : 'negative';
                const sign = change >= 0 ? '+' : '';

                html += `
                    <div class="watchlist-item" data-ticker="${ticker}">
                        <span class="ticker">${ticker}</span>
                        <span class="price">${price.toFixed(2)}</span>
                        <span class="change ${cls}">${sign}${change.toFixed(1)}%</span>
                    </div>
                `;
            }

            watchlistEl.innerHTML = html;

            // Add click handlers
            document.querySelectorAll('.watchlist-item').forEach(el => {
                el.addEventListener('click', function() {
                    const ticker = this.dataset.ticker;
                    if (ticker && ticker !== currentTicker) {
                        currentTicker = ticker;
                        loadChartData(ticker);
                    }
                });
            });
        }

        // ============================================================
        //  LOAD CHART DATA
        // ============================================================
        async function loadChartData(ticker) {
            try {
                // Try to get from cache first
                if (cachedData && cachedData.history && cachedData.history[ticker]) {
                    renderChart(ticker, cachedData.history[ticker]);
                    return;
                }

                // Fetch from API
                const history = await getStockHistory(ticker);
                
                // Cache it
                if (cachedData) {
                    if (!cachedData.history) cachedData.history = {};
                    cachedData.history[ticker] = history;
                    saveCache(cachedData);
                }

                renderChart(ticker, history);
            } catch (error) {
                console.error(`Failed to load chart for ${ticker}:`, error);
                // Use fallback
                const fallback = FALLBACK_HISTORY[ticker] || generateRealisticHistory(100, 30);
                renderChart(ticker, fallback);
            }
        }

        // ============================================================
        //  MAIN: LOAD DASHBOARD
        // ============================================================
        async function loadDashboard() {
            // Check cache first
            const cached = loadCache();
            if (cached) {
                cachedData = cached.data;
                cacheTimestamp = cached.timestamp;
                setBeaconOnline(true);
                updateCacheUI();

                const stocks = cachedData.stocks || FALLBACK_STOCKS;
                const liveData = cachedData.liveData || FALLBACK_DATA;
                allStocks = stocks;
                renderWatchlist(stocks, liveData);
                
                // Load chart for first stock
                if (stocks.length > 0) {
                    currentTicker = stocks[0].ticker || stocks[0].symbol;
                    if (cachedData.history && cachedData.history[currentTicker]) {
                        renderChart(currentTicker, cachedData.history[currentTicker]);
                    } else {
                        loadChartData(currentTicker);
                    }
                }

                // Refresh in background
                refreshDataInBackground();
                return;
            }

            // No cache - fetch from API
            setBeaconOnline(true);
            showStatus('⏳ Fetching Ugandan stocks from Mansa API...', 'loading');

            try {
                // STEP 1: Get all stocks on USE
                const stocks = await getUSEStocks();
                allStocks = stocks;

                if (!stocks || stocks.length === 0) {
                    throw new Error('No stocks returned from API');
                }

                showStatus(`📊 Found ${stocks.length} stocks on USE. Fetching live data...`, 'loading');

                // STEP 2: Get live data for each stock
                const liveData = {};
                const historyData = {};
                const promises = stocks.map(async (stock) => {
                    const ticker = stock.ticker || stock.symbol;
                    if (!ticker) return;
                    
                    try {
                        const data = await getStockData(ticker);
                        liveData[ticker] = data;
                        
                        // Also fetch history for the first stock
                        if (ticker === stocks[0].ticker) {
                            const history = await getStockHistory(ticker);
                            historyData[ticker] = history;
                        }
                    } catch (err) {
                        console.warn(`Failed to fetch ${ticker}:`, err);
                        liveData[ticker] = FALLBACK_DATA[ticker] || { price: 0, change_pct: 0 };
                    }
                });
                await Promise.allSettled(promises);

                // STEP 3: Build complete dataset
                const fullData = {
                    stocks: stocks,
                    liveData: liveData,
                    history: historyData
                };

                // Save to cache
                saveCache(fullData);

                // Render watchlist
                renderWatchlist(stocks, liveData);

                // Load chart for default ticker
                if (stocks.length > 0) {
                    currentTicker = stocks[0].ticker || stocks[0].symbol;
                    if (historyData[currentTicker]) {
                        renderChart(currentTicker, historyData[currentTicker]);
                    } else {
                        loadChartData(currentTicker);
                    }
                }

                setBeaconOnline(true);
                showStatus(`✅ ${stocks.length} stocks loaded successfully`, 'success');

            } catch (error) {
                console.error('Dashboard load error:', error);
                setBeaconOnline(false);

                // Fallback to mock data
                showStatus('⚠️ Using fallback data (API unavailable)', 'error');
                allStocks = FALLBACK_STOCKS;
                renderWatchlist(FALLBACK_STOCKS, FALLBACK_DATA);
                currentTicker = FALLBACK_STOCKS[0].ticker;
                
                // Load fallback chart
                const fallbackHistory = FALLBACK_HISTORY[currentTicker] || generateRealisticHistory(100, 30);
                renderChart(currentTicker, fallbackHistory);

                // Cache fallback data
                const fallbackFull = {
                    stocks: FALLBACK_STOCKS,
                    liveData: FALLBACK_DATA,
                    history: FALLBACK_HISTORY
                };
                saveCache(fallbackFull);
            }
        }

        // ============================================================
        //  REFRESH IN BACKGROUND
        // ============================================================
        async function refreshDataInBackground() {
            try {
                const stocks = await getUSEStocks();
                if (stocks && stocks.length > 0) {
                    const liveData = {};
                    const promises = stocks.map(async (stock) => {
                        const ticker = stock.ticker || stock.symbol;
                        if (!ticker) return;
                        const data = await getStockData(ticker);
                        liveData[ticker] = data;
                    });
                    await Promise.allSettled(promises);

                    const fullData = { 
                        stocks, 
                        liveData,
                        history: cachedData?.history || {}
                    };
                    saveCache(fullData);
                    renderWatchlist(stocks, liveData);
                    setBeaconOnline(true);
                }
            } catch (error) {
                console.warn('Background refresh failed:', error);
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        loadDashboard();

        // Auto-refresh every 5 minutes
        setInterval(() => {
            refreshDataInBackground();
        }, 5 * 60 * 1000);

        // Update cache TTL display every 10 seconds
        setInterval(updateCacheUI, 10000);

        // Handle window resize
        window.addEventListener('resize', () => {
            if (chart) {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            }
        });
    </script>
</body>
</html>
